name: Publish to npm

# Manual only. Run it from the Actions tab (or `gh workflow run publish.yml --ref <branch>`) after the
# release PR is reviewed and merged. The dispatched branch decides the npm dist-tag:
#   master                      -> latest
#   release/<major>.<minor>.x   -> legacy-<major>-<minor> (never moves latest)
# Any other ref is refused.
# Auth is npm trusted publishing (OIDC): no NPM_TOKEN secret, provenance attached automatically.
# The trusted publisher on npmjs.com must point at this repository and the file name "publish.yml".

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: yarn
      - name: Resolve the dist-tag
        id: tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$REF_NAME" = "master" ]; then
            TAG=latest
          elif [[ "$REF_NAME" =~ ^release/([0-9]+)\.([0-9]+)\.x$ ]]; then
            LINE="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
            if [[ "$VERSION" != "$LINE".* ]]; then
              echo "::error::package.json version $VERSION does not belong to $REF_NAME"
              exit 1
            fi
            TAG="legacy-${BASH_REMATCH[1]}-${BASH_REMATCH[2]}"
          else
            echo "::error::Refusing to publish from $REF_NAME; use master or release/<major>.<minor>.x"
            exit 1
          fi
          if [ "$REF_NAME" != "master" ] && [ "$TAG" = "latest" ]; then
            echo "::error::Only master may publish under the latest dist-tag"
            exit 1
          fi
          echo "Publishing $VERSION from $REF_NAME under the '$TAG' dist-tag"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      # Trusted publishing needs npm 11.5.1+; Node 24 ships an older 11.x.
      - run: npm install -g npm@latest
      - run: yarn install --frozen-lockfile
      - run: yarn jest --ci
        env:
          GQL_CLIENT_DIST_PATH: .
      - name: Skip if this version is already on npm
        id: version
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already published; nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        if: steps.version.outputs.publish == 'true'
        run: npm publish --access public --tag "${{ steps.tag.outputs.tag }}"
